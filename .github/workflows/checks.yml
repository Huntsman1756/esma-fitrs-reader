name: Tests and security
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.25
      - run: uv sync --locked --extra dev --extra security
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests
      - run: uv run --locked pip-audit --local --skip-editable
      - name: Static analysis report
        run: |
          uv run --locked bandit -r src -f json -o bandit.json || status=$?
          test "${status:-0}" -le 1
          cat bandit.json
