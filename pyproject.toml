[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esma-fitrs-reader"
version = "0.1.0"
description = "Capture public ESMA transparency files and query exact published results offline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["duckdb>=1.1", "pyarrow>=15", "defusedxml>=0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
security = ["pip-audit>=2.9", "bandit>=1.8"]

[project.scripts]
esma-fitrs-reader = "esma_fitrs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esma_fitrs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
